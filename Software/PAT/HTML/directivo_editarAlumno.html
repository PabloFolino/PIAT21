<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 40px;
    }

    .box {
      max-width: 1100px;
      margin: auto;
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2, h3 {
      margin-top: 0;
      color: #1976d2;
    }

    label {
      font-weight: 600;
      font-size: 13px;
    }

    input, select {
      padding: 8px;
      margin: 5px 0 15px 0;
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #1976d2;
    }

    input[disabled] {
      background-color: #f0f0f0;
    }

    .row {
      display: flex;
      gap: 15px;
    }

    .col {
      flex: 1;
    }

    button {
      padding: 10px 18px;
      border: none;
      background: #1976d2;
      color: white;
      cursor: pointer;
      border-radius: 4px;
      font-weight: 600;
    }

    button:hover {
      background: #125ea5;
    }

    .btn-guardar {
      background: #2e7d32;
    }

    .btn-guardar:hover {
      background: #1b5e20;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 14px;
    }

    th {
      background: #1976d2;
      color: white;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
      cursor: pointer;
    }

    tr:hover {
      background-color: #f1f7ff;
    }

    .msg {
      margin-top: 15px;
      font-weight: bold;
    }

    .volver {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #1976d2;
      color: white;
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 9999;
    }

    .volver:hover {
      background-color: #125aa0;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .acciones {
      display: flex;
      justify-content: flex-end; /* derecha */
      margin-top: 20px;
    }

    .btn-guardar {
      background: linear-gradient(135deg, #5b86e5, #36d1dc);
      border: none;
      color: white;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 999px; /* estilo pastilla */
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
      transition: all 0.2s ease-in-out;
    }

    .btn-guardar:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }

    .separador-log {
      margin-top: 40px;
      margin-bottom: 15px;
      border: none;
      height: 1px;
      background: #ccc;
    }

    .log-titulo {
      font-size: 22px;
      font-weight: 500;
      color: #000;
    }

  </style>
</head>

<body>
<div class="box">

<h2>Editar Alumno</h2>

<!-- ===================== BUSCADOR ===================== -->

<div class="row">
  <div class="col">
    <input type="text" id="filtro" placeholder="Buscar por Apellido, Nombre o DNI">
  </div>
  <div>
    <button onclick="buscarAlumnos()">Buscar</button>
  </div>
</div>

<table id="tablaResultados">
  <thead>
    <tr>
      <th>Apellido</th>
      <th>Nombre</th>
      <th>DNI</th>
      <th>Año</th>
      <th>Turno</th>
      <th>Especialidad</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<hr>

<h3>Datos del Alumno</h3>

<div class="row">
  <div class="col">
    <label>Apellido</label>
    <input type="text" id="apellido">
  </div>
  <div class="col">
    <label>Nombre</label>
    <input type="text" id="nombre">
  </div>
  <div class="col">
    <label>DNI</label>
    <input type="number" id="dni" min="0">
  </div>
</div>


<div class="grid-3">
  <div>
    <label>Nacionalidad</label>
    <input type="text" id="nacionalidad">
  </div>

  <div>
    <label>Fecha Nacimiento</label>
    <input type="date" id="fechaNacimiento">
  </div>

  <div>
    <label>Email Address</label>
    <input type="email" id="emailAddress">
  </div>

  <div>
    <label>Email ALU</label>
    <input type="email" id="alu">
  </div>

  <div>
    <label>Distrito</label>
    <input type="text" id="distrito">
  </div>

  <div>
    <label>Municipio</label>
    <input type="text" id="municipio">
  </div>

  <div>
    <label>Calle</label>
    <input type="text" id="call">
  </div>

  <div>
    <label>CP</label>
    <input type="text" id="cp">
  </div>

</div>

<hr>

<h3>Tutores</h3>

<div class="row">
  <div class="col"><input type="text" id="tutor1Nombre" placeholder="Tutor 1 Nombre"></div>
  <div class="col"><input type="text" id="tutor1Apellido" placeholder="Tutor 1 Apellido"></div>
  <div class="col"><input type="text" id="tutor1Telefono" placeholder="Tutor 1 Teléfono"></div>
  <div class="col"><input type="email" id="tutor1Email" placeholder="Tutor 1 Email"></div>
</div>

<div class="row">
  <div class="col"><input type="text" id="tutor2Nombre" placeholder="Tutor 2 Nombre"></div>
  <div class="col"><input type="text" id="tutor2Apellido" placeholder="Tutor 2 Apellido"></div>
  <div class="col"><input type="text" id="tutor2Telefono" placeholder="Tutor 2 Teléfono"></div>
  <div class="col"><input type="email" id="tutor2Email" placeholder="Tutor 2 Email"></div>
</div>

<hr>

<div class="row">
  <div class="col">
    <label>Año</label>
    <select id="anio">
      <option value="">Seleccione</option>
      <option>1</option>
      <option>2</option>
      <option>3</option>
      <option>4</option>
      <option>5</option>
      <option>6</option>
      <option>7</option>
    </select>
  </div>
  <div class="col">
    <label>División</label>
    <input type="text" id="division">
  </div>
  <div class="col">
    <label>Turno</label>
    <select id="turno">
      <option value="">Seleccione</option>
      <option>TD</option>
      <option>TN</option>
    </select>
  </div>
  <div class="col">
    <label>Especialidad</label>
    <select id="especialidad">
      <option value="">Seleccione</option>
      <option>CB</option>
      <option>CSC</option>
      <option>CSM</option>
    </select>
  </div>
</div>

<label>Ficha Salud</label>
<input type="text" id="fichaSalud">

<hr>

<h3>Datos NO editables</h3>

<label>Nombre Docente</label>
<input type="text" id="nombreDocente" disabled>

<label>URL Archivo</label>
<input type="text" id="urlArchivo" disabled>

<label>URL Carpeta</label>
<input type="text" id="urlCarpeta" disabled>

<div class="acciones">
  <button class="btn-guardar" onclick="guardarAlumno()">
    Guardar Cambios
  </button>
</div>

<hr class="separador-log">
<h3 class="log-titulo">Log de acciones</h3>
<div class="msg" id="msg"></div>

</div>

<button class="volver" onclick="volverPagina('directivo')">&larr; Volver</button>

<script>
  function limpiarFormulario() {
  // Limpiar todos los inputs y selects excepto los disabled
  document.querySelectorAll("input, select").forEach(el => {
    el.value = "";
  });
  // Limpiar mensaje
  document.getElementById("msg").innerText = "";
}

function limpiarTabla() {
  const tbody = document.querySelector("#tablaResultados tbody");
  tbody.innerHTML = "";
}

function buscarAlumnos() {
  const filtro = document.getElementById("filtro").value.trim();

  if (!filtro) {
    limpiarFormulario();
    limpiarTabla();
    document.getElementById("msg").innerText = "Ingrese un criterio de búsqueda.";
    return;
  }

  limpiarFormulario();
  limpiarTabla();

  google.script.run
    .withSuccessHandler(mostrarResultados)
    .withFailureHandler(err => document.getElementById("msg").innerText = err.message)
    .findAlumnos(filtro);
}

function mostrarResultados(lista) {
  const tbody = document.querySelector("#tablaResultados tbody");
  tbody.innerHTML = "";
  // Escribe mensaje en el Log
  document.getElementById("msg").innerText = "Alumnos encontrados.";
  if (!lista.length) {
    tbody.innerHTML = "<tr><td colspan='6'>No se encontraron resultados</td></tr>";
    // Escribe mensaje en el Log
    document.getElementById("msg").innerText = "No se encontraron alumnos.";
    return;
  }

  lista.forEach(al => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${al.apellido}</td>
      <td>${al.nombre}</td>
      <td>${al.dni}</td>
      <td>${al.anio}</td>
      <td>${al.turno}</td>
      <td>${al.especialidad}</td>
    `;
    tr.onclick = () => cargarAlumno(al.dni);
    tbody.appendChild(tr);
  });
}

function cargarAlumno(dni) {
  google.script.run
    .withSuccessHandler(llenarFormulario)
    //.withFailureHandler(err => alert(err.message))
    .withFailureHandler(err => document.getElementById("msg").innerText =err.message)
    .obtenerAlumno(dni);
}

function llenarFormulario(a) {

  if (!a || typeof a !== "object") {
    //alert("No se pudo cargar el alumno. Verifique el DNI.");
    document.getElementById("msg").innerText ="No se pudo cargar el alumno. Verifique el DNI.";
    return;
  }

  Object.keys(a).forEach(key => {
    const el = document.getElementById(key);
    if (el) {
      el.value = a[key] ?? "";
    }
  });
}

function guardarAlumno() {

  const alumno = {};
  document.querySelectorAll("input, select").forEach(input => {
    if (!input.disabled) {
      alumno[input.id] = input.value.trim();
    }
  });

  if (!alumno.apellido || !alumno.nombre || !alumno.dni) {
    //alert("Apellido, Nombre y DNI son obligatorios");
    document.getElementById("msg").innerText ="Apellido, Nombre y DNI son obligatorios.";
    return;
  }

  google.script.run
    .withSuccessHandler(msg => {
      document.getElementById("msg").innerText = msg;
    })
    //.withFailureHandler(err => alert(err.message))
    .withFailureHandler(err => document.getElementById("msg").innerText =(err.message))
    .actualizarAlumno(alumno);
}
function volverPagina(page) {
  google.script.run
    .withSuccessHandler(url => {
      window.top.location.href = url + "?page=" + page;
    })
    .withFailureHandler(err => {
      //alert("Error al volver: " + err.message);
      document.getElementById("msg").innerText ="Error al volver: "+err.message;
    })
    .getBaseUrl();
}

</script>

</body>
</html>
