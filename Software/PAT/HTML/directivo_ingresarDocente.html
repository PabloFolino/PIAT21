<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 40px;
    }

    .box {
      max-width: 1100px;
      margin: auto;
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 12px rgba(0,0,0,.1);
    }

    h1 { 
      text-align:center; 
      margin-bottom:25px; 
    }

    /* ===== BUSCADOR EN LINEA ===== */
    .buscador {
      display:flex;
      gap:15px;
      align-items:center;
      margin-top:10px;
    }

    .buscador input {
      flex:1;
    }

    /* ================== FORMATO CAMPOS ================== */

    #formularioDocente {
      margin-top:20px;
      display:grid; 
      grid-template-columns: 1fr 1fr; 
      gap:20px 40px;
    }

    .campo {
      display:flex;
      flex-direction:column;
    }

    .campo label {
      font-weight:600;
      margin-bottom:6px;
    }

    input, select {
      padding:10px;
      font-size:15px;
      height:42px;
      border:1px solid #ccc;
      border-radius:6px;
      width:100%;
      box-sizing:border-box;
    }

    button {
      padding:10px 18px;
      background:#1976d2;
      color:white;
      border:none;
      border-radius:20px;
      cursor:pointer;
      font-size:14px;
      white-space:nowrap;
    }

    button:hover { 
      background:#125aa0; 
    }

    .guardar-container{
      display:flex;
      justify-content:flex-end;
      margin-top:25px;
    }

    table {
      width:100%;
      border-collapse:collapse;
      margin-top:20px;
    }

    th,td {
      border:1px solid #ddd;
      padding:8px;
      text-align:center;
    }

    th {
      background:#1976d2;
      color:white;
    }

    tr:hover {
      background:#f1f1f1;
      cursor:pointer;
    }

    .msg { 
      margin-top:20px; 
      min-height:24px; 
    }

    .error { 
      color:#c62828; 
      font-weight:bold; 
    }

    .ok { 
      color:#2e7d32; 
      font-weight:bold; 
    }

    /*=============== Boton volver ===========================*/
    .volver {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #1976d2;
      color: white;
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 9999;
    }

    .volver:hover {
      background-color: #125aa0;
    }

  </style>
</head>

<body>

<div class="box">

  <h1>Ingreso de docente</h1>

  <label>
    1- Busque el Nombre, Apellido o el DNI del docente <br>
    --- para saber si esta en la base de datos ---
  </label>

  <div class="buscador">
    <input type="text" id="filtroDocente">
    <button onclick="buscarDocentesGrupo()">Buscar</button>
  </div>

  <div id="listaPrimera"></div>
  <hr>

  <label>2- LLenar todos los campos</label>
  
  <div id="formularioDocente">

    <div class="campo">
      <label>Apellido y Nombre</label>
      <input type="text" id="apellidoNombre" placeholder="Apellido, Nombre">
    </div>

    <div class="campo">
      <label>Email</label>
      <input type="email" id="emailDocente"placeholder="nombre.apellido@bue.edu.ar">
    </div>

    <div class="campo">
      <label>DNI</label>
      <input type="number" id="dniDocente" min="0"placeholder="Sin puntos">
    </div>

    <div class="campo">
      <label>Ciclos</label>
      <input type="text" id="ciclosDocente" placeholder="CB,CSC,...">
    </div>

    <div class="campo">
      <label>Turno</label>
      <select id="turnoDocente">
        <option value="">Seleccione</option>
        <option value="TD">TD</option>
        <option value="TN">TN</option>
      </select>
    </div>

    <div class="campo">
      <label>Horas</label>
      <input type="number" id="horasDocente" min="0"placeholder="número entero">
    </div>

    <div class="campo">
      <label>Horas sin Alumnos</label>
      <input type="number" id="horasSinAlumnos" min="0"placeholder="número entero">
    </div>

    <div class="campo">
      <label>Máx Alumnos</label>
      <input type="number" id="maxAlumnos" min="0" placeholder="número entero">
    </div>

  </div>

  <div class="guardar-container">
    <button onclick="guardarDocente()">Guardar docente</button>
  </div>
  
  <hr class="divider">
  <label>Log de acciones</label>
  <div id="msg" class="msg"></div>

</div>

<button class="volver" onclick="volverPagina('directivo')">&larr; Volver</button>

<script>

let docenteOrigen = null;
let cantidadOrigen = 0;

function buscarDocentesGrupo() {
  const filtro = document.getElementById("filtroDocente").value;
  document.getElementById("msg").innerHTML = "Buscando docentes...";

  google.script.run
    .withSuccessHandler(mostrarPrimerListado)
    .withFailureHandler(err=>{
      document.getElementById("msg").innerHTML =
      "<span class='error'>"+err.message+"</span>";
    })
    .findDocentes(filtro);
}

function mostrarPrimerListado(data){
  if(!data || data.length===0){
    document.getElementById("msg").innerHTML =
    "<span class='error'>No se encontraron docentes.</span>";
    return;
  }

  let html=`<table>
  <tr>
    <th>Apellido y Nombre</th>
    <th>DNI</th>
    <th>Turno</th>
    <th>Alumnos asignados</th>
    <th>Vacantes</th>
  </tr>`;

  data.forEach(doc=>{
    html+=`
      <tr>
        <td>${doc.nombre}</td>
        <td>${doc.dni}</td>
        <td>${doc.turno}</td>
        <td>${doc.asignados}</td>
        <td>${doc.vacantes}</td>
      </tr>`;
  });

  html+="</table>";

  document.getElementById("listaPrimera").innerHTML=html;
  document.getElementById("msg").innerHTML="<span class='ok'>Docentes encontrados.</span>";
}

function guardarDocente() {

  const apellidoNombre = document.getElementById("apellidoNombre").value.trim();
  const email = document.getElementById("emailDocente").value.trim();
  const dni = document.getElementById("dniDocente").value;
  const ciclos = document.getElementById("ciclosDocente").value.trim();
  const turno = document.getElementById("turnoDocente").value;
  const horas = Number(document.getElementById("horasDocente").value);
  const horasSin = Number(document.getElementById("horasSinAlumnos").value);
  const maxAlumnos = Number(document.getElementById("maxAlumnos").value);

  const msgDiv = document.getElementById("msg");

  if (!apellidoNombre) { msgDiv.innerHTML="<span class='error'>Apellido y Nombre es obligatorio.</span>"; return; }
  if (!email) { msgDiv.innerHTML="<span class='error'>Email es obligatorio.</span>"; return; }
  if (!dni) { msgDiv.innerHTML="<span class='error'>DNI es obligatorio.</span>"; return; }
  if (!ciclos) { msgDiv.innerHTML="<span class='error'>Ciclos es obligatorio.</span>"; return; }
  if (!turno) { msgDiv.innerHTML="<span class='error'>Turno es obligatorio.</span>"; return; }
  if (horas < 0) { msgDiv.innerHTML="<span class='error'>Horas no puede ser negativo.</span>"; return; }
  if (horasSin < 0) { msgDiv.innerHTML="<span class='error'>Horas sin alumnos no puede ser negativo.</span>"; return; }
  if (horasSin >= horas) { msgDiv.innerHTML="<span class='error'>Horas sin alumnos debe ser menor que Horas.</span>"; return; }

  const docente = { apellidoNombre, email, dni, ciclos, turno, horas, horasSin, maxAlumnos };

  msgDiv.innerHTML = "Guardando docente...";

  console.log("Docente enviado:",docente);

  google.script.run
    .withSuccessHandler(msg=>{
      msgDiv.innerHTML = "<span class='ok'>" + msg + "</span>";
    })
    .withFailureHandler(err=>{
      msgDiv.innerHTML = "<span class='error'>" + err.message + "</span>";
    })
    .guardarDocente(docente);
}

function volverPagina(page) {
  google.script.run
    .withSuccessHandler(url => {
      window.top.location.href = url + "?page=" + page;
    })
    .withFailureHandler(err => {
      alert("Error al volver: " + err.message);
    })
    .getBaseUrl();
}

</script>

</body>
</html>
