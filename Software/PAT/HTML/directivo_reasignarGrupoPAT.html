<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 40px;
    }

    .box {
      max-width: 1100px;
      margin: auto;
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 12px rgba(0,0,0,.1);
    }

    h1 { text-align:center; margin-bottom:25px; }

    input {
      padding:10px;
      font-size:15px;
      width:300px;
    }

    button {
      padding:8px 14px;
      background:#1976d2;
      color:white;
      border:none;
      border-radius:20px;
      cursor:pointer;
    }

    button:hover { background:#125aa0; }

    table {
      width:100%;
      border-collapse:collapse;
      margin-top:20px;
    }

    th,td {
      border:1px solid #ddd;
      padding:8px;
      text-align:center;
    }

    th {
      background:#1976d2;
      color:white;
    }

    tr:hover {
      background:#f1f1f1;
      cursor:pointer;
    }

    .msg { margin-top:20px; min-height:24px; }

    .error { color:#c62828; font-weight:bold; }
    .ok { color:#2e7d32; font-weight:bold; }

    /*=============== Boton volver ===========================*/
    .volver {
      position: fixed;
      bottom: 20px;
      right: 20px;

      width: auto !important;
      min-width: unset !important;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      background-color: #1976d2;
      color: white;
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;

      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 9999;
    }

    .volver:hover {
      background-color: #125aa0;
    }




  </style>
</head>

<body>

<div class="box">

  <h1>Reasignación Masiva de Grupo PAT</h1>

  <label>Ingresar Nombre o Apellido del docente de ORIGEN </label><br>
  <input type="text" id="filtroDocente">
  <button onclick="buscarDocentesGrupo()">Buscar</button>

  <div id="listaPrimera"></div>
  <hr>
  <label>Seleccionar docente DESTINO</label>
  <div id="listaSegunda"></div>

  
  <hr class="divider">
  <label>Log de acciones</label>
  <div id="msg" class="msg"></div>

</div>

<!-- BOTÓN VOLVER -->
<button class="volver" onclick="volverPagina('directivo')">&larr; Volver</button>

<script>

let docenteOrigen = null;
let cantidadOrigen = 0;

/* ================= PRIMER LISTADO ================= */

function buscarDocentesGrupo() {

  const filtro = document.getElementById("filtroDocente").value;
  
  document.getElementById("msg").innerHTML = "Buscando docentes...";

  google.script.run
    .withSuccessHandler(mostrarPrimerListado)
    .withFailureHandler(err=>{
      document.getElementById("msg").innerHTML =
      "<span class='error'>"+err.message+"</span>";
    })
    .getDocentesConAlumnosPorFiltro(filtro);
}

function mostrarPrimerListado(data){

  if(!data || data.length===0){
    document.getElementById("msg").innerHTML =
    "<span class='error'>No se encontraron docentes.</span>";
    return;
  }

  let html=`<table>
  <tr>
    <th>Apellido y Nombre</th>
    <th>Turno</th>
    <th>Alumnos asignados</th>
    <th>Vacantes</th>
  </tr>`;

  data.forEach(doc=>{
    html+=`
      <tr onclick="seleccionarDocenteOrigen('${doc.nombre}',${doc.asignados},'${doc.turno}','${doc.ciclos}')">
        <td>${doc.nombre}</td>
        <td>${doc.turno}</td>
        <td>${doc.asignados}</td>
        <td>${doc.vacantes}</td>
      </tr>`;
  });

  html+="</table>";

  document.getElementById("listaPrimera").innerHTML=html;
  document.getElementById("msg").innerHTML="<span class='ok'>Seleccione docente origen.</span>";
}

/* ================= SEGUNDO LISTADO ================= */

function seleccionarDocenteOrigen(nombre,asignados,turno,ciclos){

  docenteOrigen = {nombre,turno,ciclos};
  cantidadOrigen = asignados;
  // 🔹 Limpiar listado de destino anterior
  document.getElementById("listaSegunda").innerHTML = "";

  document.getElementById("msg").innerHTML =
  "Buscando docentes compatibles...";

  google.script.run
    .withSuccessHandler(mostrarSegundoListado)
    .withFailureHandler(err=>{
      document.getElementById("msg").innerHTML =
      "<span class='error'>"+err.message+"</span>";
    })
    .getDocentesCompatibles(nombre,asignados,turno,ciclos);
}

function mostrarSegundoListado(data){

  if(!data || data.length===0){
    document.getElementById("msg").innerHTML =
    "<span class='error'>No hay docentes compatibles.</span>";
    return;
  }

  let html=`<table>
  <tr>
    <th>Apellido y Nombre</th>
    <th>Turno</th>
    <th>Vacantes</th>
  </tr>`;

  data.forEach(doc=>{
    html+=`
      <tr onclick="confirmarReasignacionGrupo('${doc.nombre}')">
        <td>${doc.nombre}</td>
        <td>${doc.turno}</td>
        <td>${doc.vacantes}</td>
      </tr>`;
  });

  html+="</table>";

  document.getElementById("listaSegunda").innerHTML=html;
  document.getElementById("msg").innerHTML="<span class='ok'>Seleccione docente destino.</span>";
}

/* ================= CONFIRMAR ================= */

function confirmarReasignacionGrupo(docenteDestino){

  document.getElementById("msg").innerHTML="Procesando reasignación masiva...";

  google.script.run
    .withSuccessHandler(msg=>{

      document.getElementById("msg").innerHTML =
        "<span class='ok'>"+msg+"</span>";

      setTimeout(() => {

        document.getElementById("listaPrimera").innerHTML = "";
        document.getElementById("listaSegunda").innerHTML = "";
        document.getElementById("msg").innerHTML = "";
        document.getElementById("filtroDocente").value = "";

      }, 3000);

    })
    .withFailureHandler(err=>{
      document.getElementById("msg").innerHTML =
        "<span class='error'>"+err.message+"</span>";
    })
    .reasignarGrupoPAT(docenteOrigen.nombre,docenteDestino);
}

  /*=============== Boton volver ===========================*/
  function volverPagina(page) {
    google.script.run
      .withSuccessHandler(url => {
        window.top.location.href = url + "?page=" + page;
      })
      .withFailureHandler(err => {
        alert("Error al volver: " + err.message);
      })
      .getBaseUrl();
  }
  /*========================================================*/
</script>

</body>
</html>
